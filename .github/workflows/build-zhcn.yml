name: Build unofficial PokeDaisy 1.3.3 zh-CN APK
on:
  push:
    branches:
      - zhcn-1.3.3
    paths:
      - zhcn-build.trigger
      - .github/workflows/build-zhcn.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK and install native tools
        run: |
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version
          sdkmanager --install 'ndk;28.2.13676358' 'cmake;3.22.1' 'platforms;android-34'
      - name: Validate source and generate Chinese localization
        run: |
          grep -q 'versionName = "1.3.3"' app/build.gradle.kts
          test -d third_party/mgba
          test -d third_party/melonds
          test -d third_party/rcheevos
          python3 scripts/apply_zhcn.py
          python3 scripts/check_translations.py
          python3 scripts/gen_gamedata.py --check
      - name: Install Chinese file name and save compatibility tests
        run: |
          test -f app/src/test/kotlin/com/pokedaisy/app/ChineseRomCompatibilityTest.kt
      - name: Use a separate debug app ID to preserve the official application and saves
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          old = '    buildTypes {\n        release {'
          assert s.count(old)==1
          s = s.replace(old, '    buildTypes {\n        debug {\n            applicationIdSuffix = ".zhcn"\n        }\n        release {', 1)
          p.write_text(s)
          PY
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Chinese ROM file and ZIP compatibility
        run: ./gradlew :app:testDebugUnitTest --tests com.pokedaisy.app.ChineseRomCompatibilityTest --stacktrace
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify resulting APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          a=list(Path('app/build/outputs/apk/debug').glob('*.apk'))
          assert len(a)==1,a
          with ZipFile(a[0]) as z:
              assert 'lib/arm64-v8a/libpokedaisy.so' in z.namelist()
              assert any(n.endswith('.dex') for n in z.namelist())
          print('Ready:', a[0], 'bytes:', a[0].stat().st_size)
          PY
      - name: Publish installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeDaisy-1.3.3-zhCN-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
